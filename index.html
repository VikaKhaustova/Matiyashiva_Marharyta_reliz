<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>З Новим Роком!</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  
<!-- Контейнер для снігопаду -->
<div class="snowfall" aria-hidden="true">
  <div class="snowflake">❄</div>
  <div class="snowflake">❅</div>
  <div class="snowflake">❆</div>
  <div class="snowflake">❄</div>
  <div class="snowflake">❅</div>
  <div class="snowflake">❆</div>
  <div class="snowflake">❄</div>
  <div class="snowflake">❅</div>
  <div class="snowflake">❆</div>
  <div class="snowflake">❄</div>
  <div class="snowflake">❅</div>
  <div class="snowflake">❆</div>
</div>

  <header class="top-bar">
    <div class="stripe"></div>
  </header>

  <main class="container">
    
    <section class="hero">
      <div class="hero-text">
        <h1>Вже зима <br>та і Новий рік чекає!</h1>
      </div>
      <div class="hero-image">
        <img src="1.png">
      </div>
    </section>

   
    <section class="section">
      <h2 class="section-title">Їжа</h2>
      <div class="grid">
        <div class="card">
          <div class="card-img">
            <img src="2.png">
          </div>
          <p class="card-label">Gingerbread</p>
        </div>
        <div class="card">
          <div class="card-img">
            <img src="3.png">
          </div>
          <p class="card-label">Олів'є</p>
        </div>
        <div class="card">
          <div class="card-img">
            <img src="4.png">
          </div>
          <p class="card-label">Крабовий салат</p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Традиції</h2>
      <div class="grid">
        <div class="card">
          <div class="card-img">
            <img src="5.png">
          </div>
          <p class="card-label">Новорічний стіл</p>
        </div>
        <div class="card">
          <div class="card-img">
            <img src="6.png">
          </div>
          <p class="card-label">Подарунки</p>
        </div>
        <div class="card">
          <div class="card-img">
            <img src="7.png">
          </div>
          <p class="card-label">Іграшки новорічні</p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Види подарунків</h2>
      <div class="grid">
        <div class="card">
          <div class="card-img">
            <img src="8.png">
          </div>
          <p class="card-label">Новорічна іграшка</p>
        </div>
        <div class="card">
          <div class="card-img">
            <img src="9.png">
          </div>
          <p class="card-label">Мандаринки</p>
        </div>
        <div class="card">
          <div class="card-img">
            <img src="10.png">
          </div>
          <p class="card-label">Шкарпетки</p>
        </div>
      </div>
    </section>

    <section class="section tree-section">
      <h2 class="section-title">Новорічна ялинка</h2>
      <div class="banner-card">
        <img src="11.png">
      </div>
    </section>


    <footer class="footer">
      <h2>З НОВИМ РОКОМ!! 🎄✨</h2>
    </footer>

  </main>
